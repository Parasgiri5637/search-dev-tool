name: Build & Release VS Code Extension (.vsix)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test Analyzer Engine
        run: |
          cd analyzer
          dart pub get
          dart analyze
          dart test

      - name: Build VS Code Extension (.vsix)
        run: |
          cd vscode-extension
          npm install
          npm run compile
          npx @vscode/vsce package --no-dependencies -o ../flutter-code-map.vsix

      - name: Upload .vsix Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-code-map-vsix
          path: flutter-code-map.vsix

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: flutter-code-map.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
